name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # Daily, off-peak UTC. Current-season stats remain client-side, while this
    # refreshes build-time AP Poll projections, catches a season's Sleeper
    # `status` flipping to "complete", and picks up manager/team-name metadata
    # drift without anyone needing to remember to rebuild.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (fetch Sleeper data, generate pages, compile CSS/JS)
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # Only main ever publishes. This makes it safe to run the workflow manually
    # on a feature branch to validate the Sleeper fetch and the build end to end
    # without touching the live site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
