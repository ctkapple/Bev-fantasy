name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # Daily, off-peak UTC. Not needed for current-season freshness (that's a purely
    # client-side localStorage cache) - this exists to catch a season's Sleeper
    # `status` flipping to "complete" (freezing it into history) and to pick up
    # manager/team-name metadata drift, without anyone needing to remember to rebuild.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (fetch Sleeper data, generate pages, compile CSS/JS)
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
